# ==============================================================
# Nav2 Parameters — Unitree Go1 + Slamtec Mapper (no AMCL)
# ==============================================================
#
# TF tree expected at runtime:
#   map ──► odom ──► base_link ──► [laser_frame, joints …]
#   map→odom      : slamware_bridge_node  (use_internal_nav: false)
#   odom→base_link: odom_publisher.py     (from Go1 high_state)
#
# Key topics:
#   /scan    LaserScan      ← slamware_bridge_node
#   /map     OccupancyGrid  ← slamware_bridge_node  (transient_local QoS)
#   /odom    Odometry       ← odom_publisher.py
#   /cmd_vel Twist          → udp_high → Go1 UDP
#
# Go1 body dimensions (from const.xacro):
#   trunk 376 × 94 mm.  Footprint rectangle adds leg reach clearance.
#   footprint: [[-0.35,-0.20],[0.35,-0.20],[0.35,0.20],[-0.35,0.20]]
# ==============================================================

# ──────────────────────────────────────────────────────────────
# BT Navigator
# ──────────────────────────────────────────────────────────────
bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# ──────────────────────────────────────────────────────────────
# Controller Server  (local planner → /cmd_vel)
# Using Regulated Pure Pursuit — well-suited for Go1 high-level
# UDP mode which accepts Twist (linear.x, linear.y, angular.z).
# ──────────────────────────────────────────────────────────────
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Cruise speed — comfortable Go1 walk pace
      desired_linear_vel: 0.35
      # Lookahead geometry
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      # Heading corrections
      rotate_to_heading_angular_vel: 0.8
      rotate_to_heading_min_angle: 0.785   # ~45 deg — spin in place threshold
      use_rotate_to_heading: True
      allow_reversing: False
      max_angular_accel: 1.0
      # Transform / timing
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: False
      # Approach slow-down
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      # Collision detection via costmap
      use_collision_detection: True
      max_allowed_time_to_collision_up_to_carrot: 1.0
      # Regulated scaling
      use_regulated_linear_velocity_scaling: True
      use_fixed_curvature_lookahead: False
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: False
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      max_robot_pose_search_dist: 10.0
      use_interpolation: False

# ──────────────────────────────────────────────────────────────
# Planner Server  (global planner)
# NavFn A* — reliable, map-based global path
# ──────────────────────────────────────────────────────────────
planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: True
      allow_unknown: True

# ──────────────────────────────────────────────────────────────
# Smoother Server  (optional path smoother)
# ──────────────────────────────────────────────────────────────
smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

# ──────────────────────────────────────────────────────────────
# Behavior Server  (recovery behaviors)
# ──────────────────────────────────────────────────────────────
behavior_server:
  ros__parameters:
    use_sim_time: False
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.4
    rotational_acc_lim: 1.0

# ──────────────────────────────────────────────────────────────
# Waypoint Follower  (NavigateThroughPoses)
# ──────────────────────────────────────────────────────────────
waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: False
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# ──────────────────────────────────────────────────────────────
# Velocity Smoother  (smooths /cmd_vel output)
# Go1 max walk: 0.5 m/s linear, 1.0 rad/s angular
# ──────────────────────────────────────────────────────────────
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity:  [0.50,  0.0,  1.0]
    min_velocity:  [-0.50, 0.0, -1.0]
    max_accel:     [2.5,   0.0,  2.5]
    max_decel:     [-2.5,  0.0, -2.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ──────────────────────────────────────────────────────────────
# Local Costmap  (rolling window, uses /scan for obstacles)
# ──────────────────────────────────────────────────────────────
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Conservative rectangle:  700 mm × 400 mm  (body + leg clearance)
      footprint: "[ [-0.35, -0.20], [0.35, -0.20], [0.35, 0.20], [-0.35, 0.20] ]"
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35

      always_send_full_costmap: True

# ──────────────────────────────────────────────────────────────
# Global Costmap  (full map, static layer from slamware /map)
# ──────────────────────────────────────────────────────────────
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      track_unknown_space: true
      # Same footprint as local costmap
      footprint: "[ [-0.35, -0.20], [0.35, -0.20], [0.35, 0.20], [-0.35, 0.20] ]"
      footprint_padding: 0.02
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # slamware_bridge publishes /map with transient_local QoS — must match
        map_subscribe_transient_local: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Larger inflation on global map = safer global path
        inflation_radius: 0.55

      always_send_full_costmap: True

# ──────────────────────────────────────────────────────────────
# Map Server / Saver
# Map is provided by slamware_bridge — no yaml file to load.
# map_server is NOT started by navigation_launch.py, entries
# here are kept for completeness / potential future use.
# ──────────────────────────────────────────────────────────────
map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True
